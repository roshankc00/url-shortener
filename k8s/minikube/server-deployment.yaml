apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 5
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: url-shortener:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: server-config
            - secretRef:
                name: server-secret
